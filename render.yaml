# Render Blueprint: one free web service serving the app at / and the API at /api.
# Create it via Render -> New -> Blueprint; the only value to fill in is LLM_API_KEY.
services:
  - type: web
    name: ask-and-ace
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_API_KEY
        sync: false          # paste your Groq/Gemini key in the Render dashboard
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
